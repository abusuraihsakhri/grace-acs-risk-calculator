name: GRACE calculator CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify Python dependencies
        run: python -m pip check
      - name: Compile all Python modules
        run: python -m compileall -q agents grace.py grace_acs.py cli.py enrichment.py simulator.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run browser scoring tests
        run: node --test tests/test_browser.cjs
      - name: Verify browser JavaScript syntax
        run: node --check docs/calculator.js
