[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grace-acs-risk-calculator"
version = "3.1.0"
description = "Historical GRACE 2003 in-hospital ACS point score and reference web calculator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dr. Abu Suraih Sakhri"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
web = ["fastapi>=0.111", "uvicorn>=0.30", "pydantic>=2.0"]
dev = ["pytest>=8.0", "fastapi>=0.111", "uvicorn>=0.30", "pydantic>=2.0", "httpx>=0.27,<1"]

[project.scripts]
grace-acs = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]

[tool.setuptools]
py-modules = ["grace", "grace_acs", "cli", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*"]
