[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grace-acs-risk-calculator"
version = "3.0.0"
description = "GRACE ACS Risk Score Calculator — in-hospital and 6-month mortality risk for acute coronary syndromes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dr. Abu Suraih Sakhri"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
web = ["fastapi>=0.111", "uvicorn>=0.30", "pydantic>=2.0"]
dev = ["pytest>=8.0", "fastapi>=0.111", "uvicorn>=0.30", "pydantic>=2.0"]

[project.scripts]
grace-acs = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
